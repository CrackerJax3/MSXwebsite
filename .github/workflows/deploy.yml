name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches:
      - claude/msx-portfolio-art-integration-0e0byj
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Matteo-Y/MSX-Site serves the live site at msxbocachica.org (production build).
          # CrackerJax3/MSXwebsite builds a preview for crackerjax3.github.io/MSXwebsite/
          # (no custom domain, not indexed).
          SITE_BASE: ${{ github.repository == 'CrackerJax3/MSXwebsite' && '/MSXwebsite/' || '' }}
          SITE_URL: ${{ github.repository == 'CrackerJax3/MSXwebsite' && 'https://crackerjax3.github.io/MSXwebsite' || '' }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
